[env:esp32dev]
platform = espressif32 @ ~8.0.0
board = esp32dev
framework = arduino
upload_port = COM9
upload_speed = 115200
monitor_speed = 115200
monitor_eol = LF
build_flags =
    -DSIMPLEFOC_DEBUG
    -DSIMPLEFOC_ESP32_USELEDC
    -Wno-implicit-fallthrough       
lib_deps =
    askuric/Simple FOC@^2.4.0